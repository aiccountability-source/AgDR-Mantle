name: Build and Publish multi-arch wheels

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels for ${{ matrix.target.os }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: ubuntu-latest,   arch: auto,   target: x86_64 }
          - { os: ubuntu-latest,   arch: aarch64, target: aarch64 }
          - { os: ubuntu-latest,   arch: armv7,   target: armv7 }
          - { os: windows-latest,  arch: auto,    target: x64 }
          - { os: windows-latest,  arch: ARM64,   target: win-arm64 }
          - { os: macos-13,        arch: auto,    target: x86_64 }
          - { os: macos-14,        arch: auto,    target: aarch64 }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install maturin
        run: pip install maturin

      - name: Set up QEMU (for ARM cross-compilation on Linux)
        if: runner.os == 'Linux' && matrix.target.arch != 'auto'
        uses: docker/setup-qemu-action@v3

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target.target }}
          manylinux: auto
          args: --release --out dist --interpreter python3.9 3.10 3.11 3.12 3.13 3.14

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist

  publish:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
